# == DO NOT RUN YET ==
#   Requires the DARC-VLA L_state worker changes (see darc_vla/stage0_plan.md):
#     1. ranking head (linear + softplus) on pooled VLM features
#     2. VLM trained on the ranking objective (LoRA is the parameter-efficient
#        refinement; full-VLM tuning is the simplest first version)
#     3. worker routes L_policy + L_state (no L_corr)
